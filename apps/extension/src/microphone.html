<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FactCheck microphone setup</title>
    <link rel="stylesheet" href="microphone.css">
  </head>
  <body>
    <main class="setup" aria-labelledby="title">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>FactCheck</div>
      <div class="microphone-visual" aria-hidden="true">
        <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="microphone-mark"></div>
        <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <h1 id="title">Enable your microphone</h1>
      <p id="description">Give FactCheck access to your microphone for live transcription in Google Meet.</p>
      <aside class="privacy">OpenAI receives your microphone and call audio after you press <strong>Start checking</strong> in Meet.</aside>
      <div class="actions">
        <button id="enable" type="button"><span class="button-icon" aria-hidden="true"></span><span id="enable-label">Enable microphone</span></button>
        <button id="back" type="button" hidden>Back to Google Meet <span aria-hidden="true">↗</span></button>
        <p id="status" role="status" aria-live="polite">Chrome will ask for permission.</p>
      </div>
    </main>
    <script src="microphone.js"></script>
  </body>
</html>
