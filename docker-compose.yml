services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: factcheck
      POSTGRES_PASSWORD: factcheck
      POSTGRES_DB: factcheck
    ports:
      # Override when 5432 is taken by a local Postgres, e.g. FACTCHECK_DB_PORT=55432,
      # and point DATABASE_URL at the same port.
      - "127.0.0.1:${FACTCHECK_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factcheck -d factcheck"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
